name: collab-cli-release

# Publishes the shared `lbabus` coordination-bus CLI as an immutable, SemVer-tagged GitHub Release.
# Both the WIN and LINUX planes pull the SAME pinned version so they cannot drift.
#
# Trigger: push a tag `collab-cli-vX.Y.Z` whose X.Y.Z matches <Version> in LbaBus.csproj.

on:
  push:
    tags:
      - 'collab-cli-v*.*.*'

permissions:
  contents: write

jobs:
  harness:
    # Gate the release on the Docker-CI edge-case harness. Each target runs the runner INSIDE the image
    # build (RUN lbabus-ci ...), so a failing case fails the build and blocks the publish below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harness — ripgrep present (offline cases pass, mock cases skip)
        run: docker build -f tools/collab-cli/ci/Dockerfile --target ci-rg .

      - name: Harness — ripgrep absent (ripgrep-only fail-closed case runs)
        run: docker build -f tools/collab-cli/ci/Dockerfile --target ci-no-rg .

      - name: Harness — musl/Alpine (framework-dependent lbabus runs green on musl)
        run: docker build -f tools/collab-cli/ci/Dockerfile --target ci-musl .

      - name: Harness — musl RID contract (glibc self-contained native fails on musl)
        run: docker build -f tools/collab-cli/ci/Dockerfile --target ci-musl-native .

      - name: Harness — cross-process lease mutual-exclusion (concurrency gate)
        run: docker build -f tools/collab-cli/ci/Dockerfile --target ci-stress .

  release:
    needs: harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/collab-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive version from tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#collab-cli-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building lbabus ${version} from tag ${tag}"

      - name: Pack dotnet tool
        run: dotnet pack -c Release -p:Version=${{ steps.ver.outputs.version }} -o ../../artifacts

      - name: Publish self-contained (linux-x64)
        run: >
          dotnet publish -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }}
          -o ../../artifacts/linux-x64

      - name: Publish self-contained (win-x64)
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }}
          -o ../../artifacts/win-x64

      - name: Stage release assets
        working-directory: .
        run: |
          set -eu
          mkdir -p staging
          cp artifacts/*.nupkg staging/
          cp "artifacts/linux-x64/lbabus" "staging/lbabus-${{ steps.ver.outputs.version }}-linux-x64"
          cp "artifacts/win-x64/lbabus.exe" "staging/lbabus-${{ steps.ver.outputs.version }}-win-x64.exe"
          ls -l staging

      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "lbabus ${{ steps.ver.outputs.version }}"
          --notes "Shared cross-plane coordination bus CLI. Immutable SemVer release; both planes install this exact version."
          staging/*

name: extension-release

# Publishes the LabVIEW Benchmark Actor VS Code extension (.vsix) as an immutable, SemVer-tagged
# GitHub Release asset. The reviewer-workstation Vagrant provisioning downloads the .vsix from this
# Release and installs it into the guest (mirrors how the lbabus nupkg ships as a Release asset).
#
# Trigger: workflow_dispatch (input: version X.Y.Z) is the live path -- it builds, agreement-gates,
# keyless-signs, and uploads the signed .vsix as a run artifact; a maintainer then cuts the immutable
# GitHub Release locally with an authorized bypass token (the org ruleset blocks `git push` of the tag,
# so the retained `push: tags: ext-v*` trigger cannot fire for a new release). X.Y.Z must match "version"
# in package.json. The publish is fail-closed behind the bidirectional WIN <-> LINUX agreement gate
# (component: extension) - neither plane may unilaterally ship the extension.

on:
  push:
    tags:
      - 'ext-v*.*.*'
  # Under the org tag-creation ruleset a maintainer cannot `git push` an ext-v* tag, so the push trigger above
  # cannot fire for a new release; workflow_dispatch is the live path. It builds, agreement-gates, keyless-signs,
  # and UPLOADS the signed .vsix (+ .sigstore/.pem/.sig) as a run artifact; a maintainer then cuts the immutable
  # release locally with an authorized bypass token (`gh release create ext-vX.Y.Z staging/*`), attaching the
  # signed .vsix AT CREATION (immutable-safe). The push path is retained for if the ruleset is ever lifted.
  workflow_dispatch:
    inputs:
      version:
        description: Extension version X.Y.Z to build, keyless-sign, and stage as a signed artifact (must match package.json). Leave blank for a tag push.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    # Build + test the extension before any release can proceed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Compile + test
        run: npm test

  # Bidirectional agreement gate (operator directive): the extension .vsix Release publishes only
  # after BOTH the WIN and LINUX planes have committed agreed:true for this exact version under
  # components.extension in release-agreement.json. Fails closed, so neither plane can unilaterally ship.
  agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Derive version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"; version="${tag#ext-v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify bidirectional WIN <-> LINUX agreement (extension)
        run: node tools/collab-cli/verify-release-agreement.mjs --component extension "${{ steps.ver.outputs.version }}"

  release:
    needs: [build, agreement]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + attach assets
      id-token: write # keyless-sign the artifacts with cosign (Fulcio OIDC -> public rekor)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Derive version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"; version="${tag#ext-v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building extension ${version}"

      - name: Verify tag matches package.json version
        run: |
          set -eu
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag version ${{ steps.ver.outputs.version }} does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Package .vsix
        run: npm run package

      - name: Stage release asset
        run: |
          set -eu
          mkdir -p staging
          cp labview-benchmark-actor.vsix "staging/labview-benchmark-actor-${{ steps.ver.outputs.version }}.vsix"
          ls -l staging

      - name: Agent last gate (required pre-publish machine pre-vet -- #123 allow-set + size + manifest)
        # OS-agnostic pre-vet (scripts/agent-last-gate.mjs, #128): asserts vsix-allow-set + vsix-size (the
        # #123 leak guard), icon >=128, CHANGELOG, Marketplace-safe README, and gallery metadata. Fails
        # closed, so a leaky or incomplete candidate can never reach the GitHub Release or the Marketplace.
        # --skip-tests: the `build` job already ran `npm test` green; the package step above compiled out/.
        run: node scripts/agent-last-gate.mjs --skip-tests

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          changelog="CHANGELOG.md"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          # Extract just this version's section (header through the next "## [" header).
          if [ -f "$changelog" ]; then
            awk -v ver="$version" '
              $0 ~ ("^## \\[" ver "\\]") { grab=1; print; next }
              grab && /^## \[/ { exit }
              grab { print }
            ' "$changelog" > "$notes_file"
          fi
          # Fail-safe: fall back to a generic note if the section is missing/empty so a
          # CHANGELOG gap can never fail the release.
          if [ ! -s "$notes_file" ]; then
            printf 'LabVIEW Benchmark Actor VS Code extension %s.\n\nInstall the attached .vsix:\n\n    code --install-extension labview-benchmark-actor-%s.vsix\n' "$version" "$version" > "$notes_file"
          fi
          echo "Release notes for ${version}:"
          cat "$notes_file"
          echo "path=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Keyless-attest the release artifacts (Fulcio + public rekor)
        # Sign the staged .vsix keylessly (cosign, Actions OIDC) so the release carries a Fulcio cert + a
        # public rekor entry, attached AT CREATION with the .vsix (immutable-safe). LBA-REQ-025 / ADR-0016.
        uses: ./.github/actions/keyless-attest
        with:
          artifacts-dir: ${{ github.workspace }}/staging

      - name: Upload the keyless-signed release assets (immutable-release + org-ruleset safe)
        # Under the org tag-creation ruleset the in-Actions github.token cannot create the ext-v* tag; only a
        # maintainer's authorized bypass token can (via the releases API). So the reliable output of this job is
        # the SIGNED staging set (.vsix + its .sigstore/.pem/.sig) as a run artifact. After the bidirectional
        # agreement gate is green a maintainer downloads it and runs `gh release create ext-vX.Y.Z staging/*`,
        # attaching the signed .vsix AT CREATION (immutable-safe). Mirrors how acg-attest-v0.0.2 was cut.
        uses: actions/upload-artifact@v4
        with:
          name: ext-vsix-signed-${{ steps.ver.outputs.version }}
          path: staging/*
          if-no-files-found: error

      - name: Create GitHub Release
        # Under the org tag-creation ruleset the maintainer cuts the release LOCALLY from the signed artifact
        # with a bypass token; that `gh release create` also creates the ext-v* tag, which FIRES this push
        # trigger. So on push the release usually ALREADY exists -- detect it and no-op (this run then serves as
        # a post-cut re-validation of build + agreement + agent-last-gate at the tagged commit). Only if the
        # release is somehow absent (e.g. a future world where the ruleset is lifted and the tag was pushed
        # directly) do we create it from the freshly staged + signed assets.
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists (cut locally from the signed artifact under the org tag ruleset) -- this push-triggered run re-validated build + agreement + agent-last-gate at the tag; nothing to create."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LabVIEW Benchmark Actor ${{ steps.ver.outputs.version }}" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            staging/*

      - name: Publish to VS Code Marketplace
        # Fork-safe: only the canonical repo publishes. Fail-OPEN on a missing PAT so the GitHub Release
        # (which reviewer-workstation provisioning pulls) still succeeds without Marketplace credentials.
        # The operator supplies the VSCE_PAT secret to actually publish -- AFTER the human reviewer-VM
        # last gate and the bidirectional WIN <-> LINUX agreement gate above. Publishes the EXACT staged
        # artifact already built, tested, and agreement-gated.
        if: ${{ github.repository == 'LabVIEW-Community-CI-CD/labview-benchmark-actor' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -eu
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT secret not set -- skipping Marketplace publish (the GitHub Release was still created). Set VSCE_PAT to enable Marketplace publishing."
            exit 0
          fi
          npx vsce publish --packagePath "staging/labview-benchmark-actor-${{ steps.ver.outputs.version }}.vsix" -p "$VSCE_PAT"

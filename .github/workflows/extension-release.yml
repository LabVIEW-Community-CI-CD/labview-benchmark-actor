name: extension-release

# Publishes the LabVIEW Benchmark Actor VS Code extension (.vsix) as an immutable, SemVer-tagged
# GitHub Release asset. The reviewer-workstation Vagrant provisioning downloads the .vsix from this
# Release and installs it into the guest (mirrors how the lbabus nupkg ships as a Release asset).
#
# Trigger: push a tag `ext-vX.Y.Z` whose X.Y.Z matches "version" in package.json.
# The publish is fail-closed behind the bidirectional WIN <-> LINUX agreement gate (component:
# extension) - neither plane may unilaterally ship the extension.

on:
  push:
    tags:
      - 'ext-v*.*.*'

permissions:
  contents: write

jobs:
  build:
    # Build + test the extension before any release can proceed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Compile + test
        run: npm test

  # Bidirectional agreement gate (operator directive): the extension .vsix Release publishes only
  # after BOTH the WIN and LINUX planes have committed agreed:true for this exact version under
  # components.extension in release-agreement.json. Fails closed, so neither plane can unilaterally ship.
  agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Derive version from tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#ext-v}" >> "$GITHUB_OUTPUT"

      - name: Verify bidirectional WIN <-> LINUX agreement (extension)
        run: node tools/collab-cli/verify-release-agreement.mjs --component extension "${{ steps.ver.outputs.version }}"

  release:
    needs: [build, agreement]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Derive version from tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#ext-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building extension ${version} from tag ${tag}"

      - name: Verify tag matches package.json version
        run: |
          set -eu
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag version ${{ steps.ver.outputs.version }} does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Package .vsix
        run: npm run package

      - name: Stage release asset
        run: |
          set -eu
          mkdir -p staging
          cp labview-benchmark-actor.vsix "staging/labview-benchmark-actor-${{ steps.ver.outputs.version }}.vsix"
          ls -l staging

      - name: Guard packaging allow-set + size (#123)
        # Durable supersede of the interim size-only guard: assert `vsce ls` ships ONLY the runtime
        # allow-set (LICENSE, README.md, CHANGELOG.md, package.json, media/**, out/**) AND that the built
        # .vsix is under the size ceiling. Fails closed, so a .vscodeignore regression that re-admits a VM
        # disk (reviewer-workstation/.vagrant), node_modules, experiments, tools, docs or src can never ship.
        run: node scripts/check-package-allowlist.mjs "staging/labview-benchmark-actor-${{ steps.ver.outputs.version }}.vsix"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          changelog="CHANGELOG.md"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          # Extract just this version's section (header through the next "## [" header).
          if [ -f "$changelog" ]; then
            awk -v ver="$version" '
              $0 ~ ("^## \\[" ver "\\]") { grab=1; print; next }
              grab && /^## \[/ { exit }
              grab { print }
            ' "$changelog" > "$notes_file"
          fi
          # Fail-safe: fall back to a generic note if the section is missing/empty so a
          # CHANGELOG gap can never fail the release.
          if [ ! -s "$notes_file" ]; then
            printf 'LabVIEW Benchmark Actor VS Code extension %s.\n\nInstall the attached .vsix:\n\n    code --install-extension labview-benchmark-actor-%s.vsix\n' "$version" "$version" > "$notes_file"
          fi
          echo "Release notes for ${version}:"
          cat "$notes_file"
          echo "path=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "LabVIEW Benchmark Actor ${{ steps.ver.outputs.version }}"
          --notes-file "${{ steps.notes.outputs.path }}"
          staging/*

      - name: Publish to VS Code Marketplace
        # Fork-safe: only the canonical repo publishes. Fail-OPEN on a missing PAT so the GitHub Release
        # (which reviewer-workstation provisioning pulls) still succeeds without Marketplace credentials.
        # The operator supplies the VSCE_PAT secret to actually publish -- AFTER the human reviewer-VM
        # last gate and the bidirectional WIN <-> LINUX agreement gate above. Publishes the EXACT staged
        # artifact already built, tested, and agreement-gated.
        if: ${{ github.repository == 'LabVIEW-Community-CI-CD/labview-benchmark-actor' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -eu
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT secret not set -- skipping Marketplace publish (the GitHub Release was still created). Set VSCE_PAT to enable Marketplace publishing."
            exit 0
          fi
          npx vsce publish --packagePath "staging/labview-benchmark-actor-${{ steps.ver.outputs.version }}.vsix" -p "$VSCE_PAT"

# Seeded local CI/CD verification gate (ISO/IEC/IEEE 29119).
#
# This workflow is part of the move-ready specification package
# (LBA-REQ-008). While the package lives under
# prototype/labview-benchmark-actor/** in vi-history-suite it is a subtree, so
# this workflow is DORMANT. It activates automatically when the package is moved
# to its own repository root (see docs/cm/cm-plan.md, move step 2).
#
# The gate re-validates the retained experiment receipts and the RTM "Proven"
# evidence (node experiments/verify-local-gates.mjs) as a REAL, re-runnable
# pass/fail pipeline. It runs on BOTH a linux-native and a windows-native
# runner: that parity is the near-term horizon of linux-native mirroring the
# same mprr ring-buffer read/replay capability windows-native has (best effort).
# The verifier itself is dependency-free and OS-agnostic.
name: lba-local-gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: LBA Local Gates / verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run local verification gate
        run: node experiments/verify-local-gates.mjs

  # Extension test suite (tsc compile + activation + viewer-render + panels-render + MCP stdio round-trip +
  # MCP doc drift). Kept in a SEPARATE job from `verify` so the dependency-free gate above stays pure; this
  # job installs the devDeps (jsdom/typescript) and runs `npm test`. Runs per-PR on BOTH planes so a broken
  # extension test can no longer reach main uncaught (the gates-only job never ran npm test -- #200 shipped a
  # missing test import that only the release-time agent-last-gate caught). Node 24: jsdom's bundled undici
  # needs webidl.util.markAsUncloneable, absent on Node 20 (the ext-v0.1.0 CI failure fixed in 0.1.1).
  extension-tests:
    name: LBA Local Gates / extension tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run extension test suite
        run: npm test

